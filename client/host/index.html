<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGB Host Display</title></head>
<body>
<main>
  <section id="login">
    <h1>RGB</h1><p>Sign in to create a game room.</p>
    <form id="login-form"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form>
    <p id="error" role="alert"></p>
  </section>
  <section id="dashboard" hidden>
    <header class="topbar"><div><h1>RGB Game Display</h1><p id="welcome"></p></div><button id="logout" class="secondary">Log out</button></header>
    <button id="create">Create game session</button>
    <p id="error" role="alert"></p>
    <div id="room" hidden>
      <h2 id="session-id"></h2>
      <div id="game-root" aria-label="Shared game screen"></div>
      <div id="player-strip" aria-label="Player connection and score panels"></div>
    </div>
  </section>
</main>
<script type="module" src="./host.js"></script>
</body></html>
